name: Specification checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  spec-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 verified 2026-10-13
        with:
          persist-credentials: false
      - name: Validate specification records and references
        run: python3 scripts/check_specs.py
